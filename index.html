<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Syntra Systems</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,sans-serif;
}

html{
scroll-behavior:smooth;
}

body{
background:#050505;
color:white;
overflow-x:hidden;
}

.cursor-glow{
position:fixed;
width:500px;
height:500px;
border-radius:50%;
background:radial-gradient(
circle,
rgba(139,92,246,.20) 0%,
rgba(139,92,246,.06) 40%,
transparent 70%
);
pointer-events:none;
transform:translate(-50%,-50%);
z-index:0;
}

header{
position:fixed;
top:0;
width:100%;
padding:20px 8%;
display:flex;
justify-content:space-between;
align-items:center;
background:rgba(0,0,0,.6);
backdrop-filter:blur(15px);
border-bottom:1px solid rgba(255,255,255,.05);
z-index:999;
}

.logo{
font-size:1.6rem;
font-weight:700;
color:#a855f7;
}

nav{
display:flex;
gap:25px;
}

nav a{
color:white;
text-decoration:none;
}

.btn{
padding:12px 25px;
border-radius:12px;
background:linear-gradient(45deg,#7c3aed,#a855f7);
text-decoration:none;
color:white;
font-weight:bold;
}

.hero{
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:0 8%;
position:relative;
z-index:1;
}

.hero-content{
max-width:1200px;
width:100%;
display:grid;
grid-template-columns:1fr 1fr;
gap:60px;
align-items:center;
}

.badge{
display:inline-block;
padding:10px 18px;
border:1px solid #7c3aed;
border-radius:50px;
margin-bottom:25px;
color:#c084fc;
}

.hero h1{
font-size:5rem;
line-height:1;
margin-bottom:20px;
}

.hero h1 span{
color:#a855f7;
}

.hero p{
font-size:1.1rem;
line-height:1.8;
color:#bdbdbd;
}

.buttons{
margin-top:30px;
display:flex;
gap:15px;
flex-wrap:wrap;
}

.btn-outline{
padding:12px 25px;
border:1px solid rgba(255,255,255,.15);
border-radius:12px;
text-decoration:none;
color:white;
}

.dashboard{
background:#121218;
border:1px solid rgba(255,255,255,.05);
border-radius:25px;
padding:25px;
box-shadow:0 0 50px rgba(124,58,237,.20);
}

.stats{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
}

.card{
background:#1b1b22;
padding:20px;
border-radius:15px;
}

.card h3{
font-size:2rem;
color:#a855f7;
}

.graph{
margin-top:20px;
height:180px;
border-radius:15px;
background:linear-gradient(
180deg,
rgba(168,85,247,.8),
transparent
);
}

section{
padding:120px 8%;
position:relative;
z-index:1;
}

.section-title{
font-size:3rem;
text-align:center;
margin-bottom:50px;
}

.services{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.service{
background:#121218;
padding:30px;
border-radius:20px;
border:1px solid rgba(255,255,255,.05);
transition:.3s;
}

.service:hover{
transform:translateY(-10px);
box-shadow:0 0 30px rgba(124,58,237,.25);
}

.service h3{
margin-bottom:15px;
}

.service p{
color:#bdbdbd;
}

.cta{
text-align:center;
}

.cta h2{
font-size:3rem;
}

.cta h3{
font-size:4rem;
color:#a855f7;
margin:20px 0;
}

footer{
padding:50px;
text-align:center;
color:#9f9f9f;
border-top:1px solid rgba(255,255,255,.05);
}

@media(max-width:900px){

.hero-content{
grid-template-columns:1fr;
}

.hero h1{
font-size:3rem;
}

nav{
display:none;
}

}

</style>
</head>

<body>

<div class="cursor-glow"></div>

<header>

<div class="logo">
SYNTRA SYSTEMS
</div>

<nav>
