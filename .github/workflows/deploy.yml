# Aquapulse — publicação automática do site (GitHub Actions).
# Toda vez que um commit chega à branch main, o GitHub executa este fluxo:
#   1. testes: confere a sintaxe de todos os arquivos PHP, instala o banco em um
#      MariaDB descartável e roda backend/database/testar_banco.php;
#   2. deploy: só se os testes passarem, envia os arquivos por FTPS para a
#      hospedagem InfinityFree. Não há etapa de build: o site é PHP, publicado como está.
name: Deploy para InfinityFree

# Gatilho: quando o fluxo roda.
on:
  push:
    # Só pushes na branch main disparam o deploy (outras branches não publicam).
    branches:
      - main

# Tarefas executadas pelo fluxo: testes e, se eles passarem, deploy.
jobs:
  testes:
    runs-on: ubuntu-latest

    # Banco só para o teste: nasce vazio a cada execução e some no fim dela. É a mesma
    # versão do XAMPP. A senha abaixo não protege nada: o banco só existe nesta máquina.
    services:
      banco:
        image: mariadb:10.4
        env:
          MYSQL_ROOT_PASSWORD: teste
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pteste"
          --health-interval=5s --health-timeout=5s --health-retries=20

    # Lidas por backend/bootstrap.php no lugar do arquivo .env.
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: aquapulse_ci
      DB_USER: root
      DB_PASS: teste

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: PHP 8.0
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          extensions: pdo_mysql, mbstring
          coverage: none

      - name: Sintaxe de todos os arquivos PHP
        run: git ls-files -z '*.php' | xargs -0 -n 1 php -l

      - name: Instala o banco (migrations e dados de exemplo)
        run: php backend/database/migrate.php install

      - name: Testes do banco e das regras
        run: php backend/database/testar_banco.php

  deploy:
    # Só publica se a tarefa "testes" terminou bem.
    needs: testes
    # Máquina virtual Linux fornecida pelo GitHub para rodar os passos.
    runs-on: ubuntu-latest

    steps:
      # Passo 1: copia o código do repositório para a máquina do GitHub.
      - name: Checkout do código
        uses: actions/checkout@v4

      # Passo 2: envia os arquivos para o servidor com uma ação pronta da comunidade.
      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          # Endereço, usuário e senha do FTP NÃO ficam no arquivo: vêm dos "secrets"
          # cadastrados nas configurações do repositório no GitHub (FTP_SERVER,
          # FTP_USERNAME e FTP_PASSWORD), que o GitHub injeta só durante a execução.
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # FTPS: FTP com criptografia (TLS) na porta 21. "strict" confere o certificado do
          # servidor, então FTP_SERVER precisa ser o nome dele (ftpupload.net), não o IP.
          protocol: ftps
          port: 21
          security: strict

          # Pasta pública da hospedagem (htdocs) e pasta local enviada (a raiz do repositório).
          server-dir: /htdocs/
          local-dir: ./

          # Arquivo que a ação grava no servidor com o "retrato" do último envio:
          # nas próximas execuções só os arquivos alterados são transferidos.
          state-name: ftp-deploy-sync-state.json

          # Arquivos que NÃO são publicados: controle de versão, este fluxo, a documentação
          # e as ferramentas que só rodam no computador (simulador de sensores, estação de
          # telemetria e o iniciar.bat). O site publicado continua recebendo leituras pela API.
          # (Comentários não podem ir dentro da lista abaixo: ela é um bloco de texto.)
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/README.md
            **/CNAME
            simulador-sensor/**
            estacao/**
            iniciar.bat
